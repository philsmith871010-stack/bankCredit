name: Counterparty pipeline
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "research/**"]
  schedule:
    - cron: "10 5 * * *"     # daily 06:10 UK (BST) / 05:10 UTC
    - cron: "40 11 * * 1-5"  # weekday midday backstop; GitHub's cron can skip a slot on a quiet repository
  workflow_dispatch:
    inputs:
      adapters:
        description: "Adapters to run (space separated), default all daily"
        default: "esma yahoo pillar3 events fred dtcc ice"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: pipeline
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: OCR engine for image-only PDFs
        run: sudo apt-get install -y -qq tesseract-ocr >/dev/null
      # A push whose commit message contains [collect] behaves like a scheduled run.
      - name: Daily adapters (scheduled, manual, or a [collect] push)
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]') }}
        run: python -m bankcredit.cli run ${{ github.event.inputs.adapters || 'esma yahoo pillar3 events fred dtcc ice' }}
        continue-on-error: true      # one failing source must not stop the others from being published
      - name: Load answers from the review queue
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]') }}
        run: python -m bankcredit.cli review ingest
      - name: Quarterly adapters on the 1st, 15th and 25th
        if: ${{ github.event_name == 'schedule' }}
        run: |
          d=$(date -u +%d); case "$d" in 01|15|25) python -m bankcredit.cli run fdic eba edgar te ;; *) echo "skip";; esac
        continue-on-error: true
      # Bond quotes are fetched afresh for every build (45 days of history per bond) and never committed:
      # the exchange's terms allow private use, not redistribution. Only the change against peers is published.
      - name: Bond quotes (private, rebuilt each run)
        run: python -m bankcredit.cli run bonds
        continue-on-error: true
      - name: Export and build site
        env:
          COUNTERPARTY_OVERLAY: ${{ secrets.COUNTERPARTY_OVERLAY }}
          BANKCREDIT_DEBUG_DATA: "1"     # beta only: a Data tab per profile with raw CDS, bond quotes and facts; remove before production (ICE and Frankfurt terms)
        run: python -m bankcredit.cli build
      - name: Commit data
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]') }}
        run: |
          git config user.name "counterparty-bot"
          git config user.email "philsmith871010@gmail.com"
          git add data/
          git diff --cached --quiet || git commit -m "Pipeline data $(date -u +%F)"
          git pull --rebase -X theirs origin main   # a code push in the meantime rebuilt the same JSON; the fresh data wins
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
