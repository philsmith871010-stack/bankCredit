name: Counterparty pipeline
on:
  push:
    branches: [main, claude/bank-credit-analysis-l5vmne]
    paths-ignore: ["docs/**", "design/**", "research/**"]
  schedule:
    - cron: "10 5 * * *"     # daily 06:10 UK (BST) / 05:10 UTC
  workflow_dispatch:
    inputs:
      adapters:
        description: "Adapters to run (space separated), default all daily"
        default: "esma yahoo pillar3 events fred"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: pipeline
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Daily adapters (scheduled or manual)
        if: ${{ github.event_name != 'push' }}
        run: python -m bankcredit.cli run ${{ github.event.inputs.adapters || 'esma yahoo pillar3 events fred' }}
      - name: Load answers from the review queue
        if: ${{ github.event_name != 'push' }}
        run: python -m bankcredit.cli review ingest
      - name: Quarterly adapters on the 1st, 15th and 25th
        if: ${{ github.event_name == 'schedule' }}
        run: |
          d=$(date -u +%d); case "$d" in 01|15|25) python -m bankcredit.cli run fdic eba ;; *) echo "skip";; esac
        continue-on-error: true
      - name: Export and build site
        env:
          COUNTERPARTY_OVERLAY: ${{ secrets.COUNTERPARTY_OVERLAY }}
        run: python -m bankcredit.cli build
      - name: Commit data
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "counterparty-bot"
          git config user.email "philsmith871010@gmail.com"
          git add data/
          git diff --cached --quiet || git commit -m "Pipeline data $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
