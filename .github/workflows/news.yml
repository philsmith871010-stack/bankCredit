name: Counterparty headlines
on:
  schedule:
    - cron: "0 6-18/2 * * 1-5"   # every two hours, weekdays, about 07:00 to 19:00 UK
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: pipeline              # never alongside the daily pipeline
jobs:
  headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Headlines only (Google News per entity plus the agency sweep)
        run: BANKCREDIT_NEWS_ONLY=1 python -m bankcredit.cli run events
        continue-on-error: true
      - name: Bond quotes (private, rebuilt each run)
        run: python -m bankcredit.cli run bonds
        continue-on-error: true
      - name: Export and build site
        env:
          COUNTERPARTY_OVERLAY: ${{ secrets.COUNTERPARTY_OVERLAY }}
        run: python -m bankcredit.cli build
      - name: Commit events
        run: |
          git config user.name "counterparty-bot"
          git config user.email "philsmith871010@gmail.com"
          git add data/events.parquet data/runs.parquet data/json
          git diff --cached --quiet || git commit -m "Headlines $(date -u +%FT%H:%M)"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: headlines
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
